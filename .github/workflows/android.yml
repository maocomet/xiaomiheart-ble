name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decoded into the runner's temp dir and deleted again once the build is
      # done. The secret is passed through an environment variable rather than
      # being interpolated into the script, so it cannot leak into the log.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/signing-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "keystore decoded: $(stat -c %s "$KEYSTORE_PATH") bytes"

      # The ubuntu-latest runner image ships with the Android SDK and accepted
      # licenses; AGP pulls any missing platform/build-tools component itself.
      - name: Build debug APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Fails the build if the signing certificate ever changes, since that would
      # silently break upgrade installs. The fingerprint is public information --
      # it is embedded in every APK -- so pinning it here leaks nothing.
      - name: Verify signing certificate
        run: |
          EXPECTED="0B:5D:08:30:1A:2D:87:6F:56:C8:C2:87:DD:95:78:A6:88:81:E1:62:8A:9F:C6:E3:3D:74:0A:4C:95:54:D1:2D"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/certs.txt"
          ACTUAL=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          echo "expected certificate: $EXPECTED"
          echo "actual certificate  : $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate changed - upgrade installs would be rejected"
            exit 1
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-keystore.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
